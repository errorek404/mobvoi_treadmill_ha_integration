title: Bieżnia Mobvoi
views:
  - title: Trening
    path: mobvoi-trening
    icon: mdi:run-fast
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: tile
                entity: switch.mobvoi_power
                name: Power (Wybudź / Uśpij)
                icon: mdi:power
                color: orange
                tap_action:
                  action: toggle
              - type: tile
                entity: switch.mobvoi_start_pasa
                name: Start / Stop Pasa
                icon: mdi:play-pause
                color: green
                tap_action:
                  action: toggle

          - type: grid
            columns: 2
            square: false
            cards:
              - type: entity
                entity: sensor.mobvoi_predkosc
                name: Prędkość
                icon: mdi:speedometer
              - type: entity
                entity: sensor.mobvoi_dystans
                name: Dystans
                icon: mdi:map-marker-distance
              - type: entity
                entity: sensor.mobvoi_czas_treningu
                name: Czas
                icon: mdi:timer-outline
              - type: entity
                entity: sensor.mobvoi_kalorie
                name: Kalorie
                icon: mdi:fire

          - type: entities
            title: Regulacja prędkości
            show_header_toggle: false
            entities:
              - entity: number.mobvoi_predkosc_docelowa
                name: Suwak prędkości (km/h)

          - type: horizontal-stack
            cards:
              - type: button
                name: Spacer 2.5
                icon: mdi:walk
                tap_action:
                  action: call-service
                  service: number.set_value
                  target:
                    entity_id: number.mobvoi_predkosc_docelowa
                  data:
                    value: 2.5
              - type: button
                name: Marsz 4.5
                icon: mdi:shoe-sneaker
                tap_action:
                  action: call-service
                  service: number.set_value
                  target:
                    entity_id: number.mobvoi_predkosc_docelowa
                  data:
                    value: 4.5
              - type: button
                name: Trucht 7.0
                icon: mdi:run
                tap_action:
                  action: call-service
                  service: number.set_value
                  target:
                    entity_id: number.mobvoi_predkosc_docelowa
                  data:
                    value: 7.0
              - type: button
                name: Bieg 9.5
                icon: mdi:run-fast
                tap_action:
                  action: call-service
                  service: number.set_value
                  target:
                    entity_id: number.mobvoi_predkosc_docelowa
                  data:
                    value: 9.5

          - type: history-graph
            title: Przebieg prędkości (ostatnia godzina)
            hours_to_show: 1
            entities:
              - entity: sensor.mobvoi_predkosc
                name: Prędkość
